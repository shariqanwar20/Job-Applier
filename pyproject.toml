[project]
name = "jobapplier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-jobspy==1.4.1",
    "requests",
    "pyyaml",
    "notion-client==3.1.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
