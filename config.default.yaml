lookback_days: 3        # every source's freshness window
include_reposts: false  # true: a reposted job (same ATS id, >48h after first seen) gets its own flagged row
rules:
  # Whole words/phrases matched on the normalized title (lowercase, ASCII, punctuation -> space).
  include: [developer, engineer, programmer, software, full stack, fullstack, back end, backend, front end, frontend, sde, mobile, developpeur, developpeuse, ingenieur logiciel, ingenieure logiciel]
  # Seniority words that drop a title.
  exclude: [senior, sr, staff, principal, lead, manager, director, architect, head of, cnc, welding, robot programmer, plc, machining, machinist, job developer, community developer, recreation, elders, cad, instructor, teacher, power system, cashier, checkout, team associate, store associate]
  # Postings whose FreeHire company type is listed are dropped.
  blocked_company_types: [outstaff, agency]
  # Recruiting and staffing companies, dropped (whole words in the company name).
  blocked_companies: [jobgether, turing, placements24, vhr professional services, techedin, smart it frame, sra group, epsilon solutions, artech, lancesoft, mitchell martin, hour consulting, planit search, tekrek, flexton, axelon, aptask, alltech consulting, s i systems, tech talent international, analyst technical, lighthouse technology, randstad, robert half, teksystems, insight global, adecco, hays, kforce, cybercoders, dice, apex systems, pacer group, gurulink, compunnel, pentasia, lorven technologies, ztek consulting, tekgence, centraprise, viva tech solutions, quantum world technologies, stellar software solutions, blutic, code17tek, digitalogia, isteer, envision technology solutions, techdoquest, grand software solutions, apptad, astra north infoteck, sportstechjobs, it connex, belmont lavan, enterprise solutions inc, confidential, same as legal business name, recruiting, recruitment, staffing, consultancy, talent]
  # Words dropped from a company name before comparing two postings for the same employer.
  company_noise: [inc, ltd, llc, corp, corporation, company, co, group, plc, limited, sa, the, of, and, canada, bank, financial, technologies, technology, du, des, de, la, le, et]
  # Employer names that differ beyond the noise words: normalized name (after noise words and any (...) text are dropped) -> the name to compare as.
  company_aliases:
    toronto dominion: td
    amazon web services: amazon
    aws: amazon
    manulife john hancock: manulife
    fidelity investments: fidelity
    salesforce com: salesforce
    110 salesforce com: salesforce
    banque nationale: national
  # Intern/co-op titles are kept only at a notable company.
  intern: [intern, internship, co op, coop, stagiaire, stage]
  # Title words that rank a posting 1 (new grad / junior).
  rank1_title: [new grad, graduate, entry level, junior, jr, associate]
  # Location preference tiers, best first; remote and everything else rank after the last tier.
  cities:
    - [toronto, mississauga, markham, brampton, vaughan, oakville, richmond hill, north york, etobicoke, scarborough]
    - [vancouver, burnaby]
    - [montreal]
  # Companies whose intern/co-op roles are worth keeping (whole words in the company name).
  notable_companies: [google, amazon, microsoft, apple, meta, netflix, nvidia, shopify, stripe, uber, airbnb, databricks, snowflake, salesforce, adobe, intel, amd, ibm, oracle, cisco, atlassian, cohere, wealthsimple, rbc, td, scotiabank, bmo, cibc, disney, bloomberg, jane street, citadel, two sigma, palantir, openai, anthropic]
  # URL hosts that are job boards, not the employer's own page (substring match): no stable identity.
  aggregator_hosts: [whatjobs.com, adzuna., linkedin.com, indeed.com, torre.ai]
# Fetch order; also the tie-break priority when merging a cluster's members.
# A config.yaml override can change a source's settings but not remove a source (edit this list in your own copy for that).
sources:
  freehire: {via_recruiter: false, countries: [ca], regions: [none], categories: [software_engineering, fullstack, backend, frontend, ai_engineering, mobile]}
  indeed: {terms: [software engineer, full stack engineer], location: Canada, country: Canada, results_wanted: 100, delay_seconds: [4, 8], retry_after_429_seconds: 120}
  linkedin: {terms: [software engineer, full stack engineer], location: Canada, results_wanted: 100, delay_seconds: [4, 8], retry_after_429_seconds: 120}
notion:
  title: Full Time Role Search   # the database and its view header, set by `notion-setup`
  database_id: ""        # set in your config.yaml; `python -m jobapplier notion-setup` prints it
  data_source_id: ""     # set in your config.yaml too
mail:  # read-only Gmail (OAuth scope gmail.readonly); on when the token file exists, see README "Mail"
  client_secrets: data/gmail_client.json  # the OAuth client downloaded from Google Cloud, relative to the repo
  token: data/gmail_token.json            # written by `mail-login`
  applied_lookback_days: 365    # how far back "applied before" looks
  # A message whose subject or start of body has one of these (whole words) counts as an application confirmation.
  applied_phrases: [thank you for applying, thanks for applying, application received, we received your application, your application to, application submitted]
profile:
  name: ""  # your full name, set in config.yaml; the first and last words name the resume file
llm:  # headless Claude Code calls (`claude -p`) on your subscription
  claude: /opt/homebrew/bin/claude
  timeout_seconds: 300
  models: {tailor: claude-sonnet-5-5, classify: claude-haiku-5-5}
tailor:  # a one-page resume per approved row, from resume/master.tex; see README "Tailoring"
  master: resume/master.tex
  output_dir: output             # the PDFs, First_Last_Company_Role.pdf
  tectonic: /opt/homebrew/bin/tectonic
  tectonic_timeout: 300          # seconds per compile; the first run downloads packages
  max_drops: 8                   # optional lines dropped, at most, to fit one page
  max_words: 25                  # per resume line
  max_omit: 2                    # optional lines the model may leave out; the master already fits one page
  min_lines_per_entry: 2         # lines kept for each job or project (owner: reword or replace, not remove)
  max_description_chars: 12000   # of the job description sent to the model
  # A capitalized or technology word (Go, Node.js, C++) the model adds must be in the master line it rewords,
  # or in this list (case-insensitive). These are the usual first words of a resume line.
  allow_words: [a, an, the, and, built, wrote, made, added, designed, developed, created, implemented, improved, reduced, cut, fixed, tested, automated, moved, migrated, deployed, maintained, worked, ran, used, set, refactored, integrated, configured, documented, reviewed, delivered, increased, sped, helped, supported, contributed, assisted]
  # Never in a rewritten line (whole words, case-insensitive); seeded from Humanizer's AI-vocabulary list.
  banned_phrases: [delve, delved, leverage, leveraged, leveraging, robust, showcase, showcased, pivotal, crucial, spearheaded, testament, seamless, seamlessly, cutting-edge]
  # A line may use one of inflating_verbs only when its master line does and has none of modest_verbs.
  # Words are compared with a light stem (-ing, -ed, -s, a final e), so "leads" matches "lead".
  inflating_verbs: [lead, leads, leading, led, own, owns, owning, owned, drive, drives, driving, drove, architect, architects, architecting, architected, spearhead, spearheads, spearheading, spearheaded]
  modest_verbs: [contributed, assisted, helped, supported]
  # Spelled-out numbers: like a digit, each must be in the master line.
  number_words: [one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty, thirty, forty, fifty, hundred, hundreds, thousand, thousands, million, millions, billion, dozen, dozens, double, triple, twice, half]
  # A word from the job description must be in the master line, unless it is here or in allow_words.
  common_words: [a, an, the, and, or, but, of, to, in, "on", for, with, by, at, from, into, onto, over, across, through, using, via, as, that, which, who, this, these, those, it, its, they, them, their, our, we, you, your, is, are, be, been, was, were, new, multiple, several, many, more, most, all, each, every, other, both, team, teams, data, service, services, system, systems, code, tool, tools, test, tests, user, users, build, run, change, changes, work, project, projects, feature, features, product, products, app, application, applications, software, help, make, use, support, write, improve, design, develop, create, maintain, up, out, per, while, after, before, than, within, during, when, where, can, will, has, have, had, not, also, so, then, time, high, low, fast, quality, performance, reliability, scalable, backend, frontend, release, releases, developer, developers, engineer, engineers, production, customer, customers, ensure, deliver, monitor, end, real]

schedule:  # the LaunchAgent (install-agent) runs `python -m jobapplier run` every 30 minutes
  discover_every_minutes: 120   # discover only this often; tailoring runs on every tick

apply:  # `apply` opens ready rows in Chrome and pre-fills the form; you check it and submit. See README "Apply"
  max_tabs: 8                      # tabs opened per run; run apply again for the rest
  browser_profile: data/browser-profile  # Chrome profile kept between runs, so a sign-in you do by hand stays
  load_timeout_seconds: 30
  parser_wait_seconds: 3           # after the resume upload, for the site's resume parser to fill fields
  field_timeout_seconds: 3         # per field; a field that takes longer is left for you
  # A page whose URL or title has one of these (whole words), or that shows a password field, is left for you.
  login_words: [sign in, signin, log in, login, create account, create an account, sign up, signup, register]
  # Multi-page forms: after filling a page, apply clicks the form's button whose visible text starts with one
  # of next_words and has at most next_max_extra_words more words ("Next: Experience", "Continue to step 3"),
  # none of them in next_deny_words ("Next month", "Continue reading"). No source of its name (aria-label,
  # labelled-by text, text, value, title) may have a submit_words, login_words or sign_in_button_words
  # word. Then it fills the next page, up to max_pages pages. It stops (and leaves the page to you) when any
  # visible button on the page has a submit word, a required field is still empty, a sign-in page appears,
  # there is no next button, or the page did not change after the click (a validation error).
  max_pages: 8
  next_wait_seconds: 2             # after clicking next, for the new page to draw
  next_words: [next, continue, proceed, save and continue, save and next, save & continue, go to next]
  next_max_extra_words: 5
  next_deny_words: [month, year, week, day, slide, image, photo, video, page, pages, results, jobs, article, reading, story, payment, checkout, cart, tour, tip]
  submit_words: [submit, apply, send, finish, complete, confirm, done, review and submit, submit application]
  # Word starts that also mark a submit button: "submission", "finalize", "confirmation", "post". apply stays a
  # whole word in submit_words, so "Continue application" is still a next button.
  submit_stems: [submi, send, sent, finish, final, complet, confirm, done, post]
  sign_in_button_words: [continue with, sign in with, log in with]  # "Continue with Google" signs you in
  # A checkbox whose label has one of consent_words is ticked (terms, privacy, "the above is accurate").
  # One with an opt_in_words word (marketing, being contacted, keeping your data) is left for you, even when
  # it also has a consent word, unless tick_opt_ins.
  consent_words: [consent, agree, acknowledge, privacy, terms, certify, accurate, true and complete, authorize]
  opt_in_words: [receive, contacted, contact me, communications, future opportunities, future openings, future roles, talent community, talent pool, subscribe, updates, newsletter, whatsapp, text, texts, sms, text message, marketing, promotional, partners, retain, retaining, job alerts]
  tick_opt_ins: false
  # A label with one of these word starts is never filled from profile.yaml: someone else's name or phone
  # ("Contact name", "Emergency contact"); your own "Contact email" or "Contact number" is still filled.
  skip_words: [contact name, contact person, relation, emergency, manager, extension, reference, referr]
  # The option picked for a demographic question when profile.yaml has voluntary_self_id: decline.
  decline_words: [prefer not, decline, do not wish, don t wish, not to answer, not to disclose, not to say, choose not, rather not, not wish to]
  # Field label -> profile.yaml key. The first rule with a pattern in the label wins (whole words, normalized
  # like titles). key: a list tries each key in turn; skip leaves the field to you; salary is the posting's
  # stated range, else salary_expectation in a text box, else salary_default; relocation is your cities
  # for a free-text "which cities" question, else relocation.willing. whole: true matches only the whole
  # label ("Name", not "Company name"). The yes/no questions come before the skip rule, since they may
  # mention an employer.
  fields:
    - {patterns: [gender, pronoun, pronouns, race, racial, ethnicity, ethnic, veteran, disability, disabled, hispanic, latino, sexual orientation, transgender, lgbtq, indigenous, visible minority], key: voluntary_self_id}
    - {patterns: [in the future require, future require, future sponsorship, sponsorship in the future], key: work_authorization.sponsorship_future}
    - {patterns: [sponsorship, sponsor], key: work_authorization.sponsorship_now}
    - {patterns: [authorized to work in canada, authorised to work in canada, eligible to work in canada, entitled to work in canada, legally work in canada, right to work in canada, permitted to work in canada], key: work_authorization.canada}
    - {patterns: [relocate, relocation], key: relocation}
    - {patterns: [company name, current company, current employer, employer, school, university, preferred name, preferred first name, nickname, referred, referral, referrer, reference, recruiter, hiring manager, cover letter, how did you hear], key: skip}
    - {patterns: [first name, given name, prenom], key: name.first}
    - {patterns: [last name, family name, surname, nom de famille], key: name.last}
    - {patterns: [full name, legal name, your name, name], key: name.full, whole: true}
    - {patterns: [email, e mail, courriel], key: email}
    - {patterns: [phone, mobile, telephone, cell, contact number], key: phone}
    - {patterns: [linkedin], key: links.linkedin}
    - {patterns: [github], key: links.github}
    - {patterns: [website, portfolio, personal site, personal url], key: [links.website, links.github]}
    - {patterns: [salary, compensation, pay expectation, pay expectations, expected pay, desired pay], key: salary}
    - {patterns: [start date, available to start, earliest start, when can you start, availability, notice period], key: start_date}
    - {patterns: [city], key: location.city}
    - {patterns: [province, state province, province state], key: location.province}
    - {patterns: [country], key: location.country}
    - {patterns: [location, where are you based, where do you live, current location], key: location.full}
